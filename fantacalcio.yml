name: Formazione fantacalcio

on:
  schedule:
    # Ogni giorno alle 16:00 UTC (18:00 in Italia d'estate, 17:00 d'inverno).
    # L'agente controlla da solo se la giornata comincia domani: se non è così, esce subito.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      forza:
        description: "Manda la mail anche se la giornata non è domani"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  formazione:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Analizza la rosa e manda la formazione
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_RUN: ${{ inputs.forza }}
        run: python src/main.py

      # Il commit della cache evita di riscaricare il calendario ogni volta e tiene
      # "attivo" il repository: senza attività GitHub spegne i cron dopo 60 giorni.
      - name: Salva la cache del calendario
        if: always()
        run: |
          git config user.name "agente-fantacalcio"
          git config user.email "agente@users.noreply.github.com"
          git add -f state/calendario.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Aggiorno la cache del calendario"
          git push || true

      - name: Salva l'anteprima come artefatto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anteprima-formazione
          path: state/
          if-no-files-found: ignore
          retention-days: 14
